<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRUN · 校园跑会话控制台</title>
<style>
  :root{
    --bg:#080b10; --panel:#0e141c; --panel2:#111a24; --line:#1b2632; --line2:#24313f;
    --txt:#e8eef6; --dim:#8595a8; --ok:#3ee08f; --warn:#f0b354; --bad:#ff5f6d; --accent:#4cc9f0;
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(1200px 600px at 12% -10%, #10202c 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #141826 0%, transparent 55%), var(--bg);
    color:var(--txt);font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh}
  header{max-width:1240px;margin:0 auto;padding:26px 22px 10px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:34px;height:34px;border-radius:11px;background:conic-gradient(from 140deg,#3ee08f,#4cc9f0 45%,#8b7bff 80%,#3ee08f);
    box-shadow:0 0 0 1px #ffffff14, 0 8px 22px #3ee08f33;position:relative}
  .mark::after{content:"";position:absolute;inset:9px;border-radius:6px;background:#080b10}
  h1{margin:0;font-size:17px;letter-spacing:.14em;font-weight:650}
  .sub{margin:1px 0 0;color:var(--dim);font-size:12px;letter-spacing:.04em}
  .hdr-right{display:flex;align-items:center;gap:10px}
  .chip{font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--accent);
    background:#4cc9f01a;border:1px solid #4cc9f033;padding:7px 10px;border-radius:9px}
  main{max-width:1240px;margin:0 auto;padding:14px 22px 48px;display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .card{background:linear-gradient(180deg,#101821,#0c131a 70%);border:1px solid var(--line);border-radius:16px;padding:16px 16px 18px;
    box-shadow:0 10px 30px #00000055, inset 0 1px 0 #ffffff08}
  .card h2{margin:0 0 12px;font-size:12px;letter-spacing:.12em;color:var(--dim);font-weight:600;text-transform:uppercase}
  .c4{grid-column:span 4}.c3{grid-column:span 3}.c5{grid-column:span 5}.c7{grid-column:span 7}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
  @media(max-width:900px){.c4,.c3,.c5,.c7,.c6,.c8{grid-column:span 12}}
  label{display:block;font-size:11px;color:var(--dim);letter-spacing:.06em;margin:0 0 5px}
  .field{margin-bottom:11px}
  input,select{width:100%;background:#0a1017;border:1px solid var(--line2);color:var(--txt);border-radius:10px;
    padding:9px 11px;font:13px var(--mono);outline:none;transition:.15s}
  input:focus,select:focus{border-color:#3ee08f66;box-shadow:0 0 0 3px #3ee08f14}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{border:0;border-radius:11px;padding:11px 16px;font:600 13px/1 inherit;cursor:pointer;transition:.15s}
  .primary{background:linear-gradient(180deg,#43e595,#2fbf7a);color:#04140c;box-shadow:0 6px 18px #3ee08f33}
  .primary:hover{filter:brightness(1.07)}
  .ghost{background:#131c26;color:var(--txt);border:1px solid var(--line2)}
  .ghost:hover{border-color:#31414f}
  .ghost.sm{padding:8px 12px;font-size:12px}
  .ring{display:flex;align-items:center;gap:16px}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{font:700 22px var(--mono);letter-spacing:-.02em}
  .ring .cap{font-size:11px;color:var(--dim);letter-spacing:.08em}
  .pill{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.08em;
    padding:5px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:block}
  .pill.run{color:var(--ok);border-color:#3ee08f40;background:#3ee08f12}.pill.run i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .pill.throttle{color:var(--warn);border-color:#f0b35440;background:#f0b35412}.pill.throttle i{background:var(--warn)}
  .pill.abort{color:var(--bad);border-color:#ff5f6d40;background:#ff5f6d12}.pill.abort i{background:var(--bad)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .stat{background:#0a1017;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .stat b{display:block;font:600 15px var(--mono)}
  .stat span{font-size:10.5px;color:var(--dim);letter-spacing:.08em}
  .checks{display:flex;flex-direction:column;gap:1px;max-height:330px;overflow:auto;padding-right:4px}
  .chk{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:7px 9px;border-radius:9px;font-size:12.5px}
  .chk:hover{background:#ffffff05}
  .chk i{width:8px;height:8px;border-radius:50%;background:var(--ok);opacity:.8}
  .chk.fail{background:#ff5f6d0d}
  .chk.fail i{background:var(--bad);box-shadow:0 0 8px #ff5f6d88}
  .chk .d{font:11px var(--mono);color:var(--dim)}
  .rules{display:flex;flex-direction:column;gap:9px}
  .rule{display:flex;gap:10px;align-items:flex-start;background:#0a1017;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .rule .ic{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;flex:0 0 auto;margin-top:1px}
  .rule.ok .ic{background:#3ee08f14;color:var(--ok)}
  .rule.bad .ic{background:#ff5f6d14;color:var(--bad)}
  .rule b{display:block;font-size:12.5px;font-weight:600}
  .rule p{margin:2px 0 0;font-size:11.5px;color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--dim);font-weight:500;font-size:10.5px;letter-spacing:.08em;padding:0 8px 8px}
  td{padding:8px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:#c7d4e2}
  .tag{font:600 10px var(--mono);padding:2px 6px;border-radius:6px;letter-spacing:.06em}
  .tag.flagged,.tag.banned{background:#ff5f6d18;color:var(--bad)}
  .tag.watch{background:#f0b35418;color:var(--warn)}
  .tag.clean{background:#3ee08f18;color:var(--ok)}
  .muted{color:var(--dim);font-size:12px}
  .inline{display:flex;gap:8px}
  .inline input{flex:1}
  .log{margin-top:10px;font:11.5px/1.6 var(--mono);color:var(--dim);white-space:pre-wrap;max-height:140px;overflow:auto}
  #toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:9}
  .t{background:#121b26;border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:10px;
    padding:10px 14px;font-size:12.5px;box-shadow:0 12px 30px #00000066;animation:in .2s ease}
  .t.bad{border-left-color:var(--bad)}.t.ok{border-left-color:var(--ok)}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#22303e;border-radius:8px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark"></div>
    <div><h1>CRUN</h1><p class="sub">校园跑会话控制台 · 自审 / 风控 / 路线</p></div>
  </div>
  <div class="hdr-right">
    <span class="chip" id="ver">v—</span>
    <span class="pill" id="glance"><i></i><span>READY</span></span>
    <button class="ghost sm" id="refresh">刷新</button>
  </div>
</header>

<main>
  <section class="card c4">
    <h2>出车参数</h2>
    <div class="row">
      <div class="field"><label>距离 (m)</label><input id="distance" value="2500" inputmode="numeric"></div>
      <div class="field"><label>配速 (s/km)</label><input id="pace" value="355" inputmode="numeric"></div>
    </div>
    <div class="field"><label>模式（仅白名单）</label>
      <select id="mode">
        <option value="campus_run">campus_run · 校园跑</option>
        <option value="morning_run">morning_run · 早操</option>
        <option value="extra_activity">extra_activity · 课外活动</option>
      </select></div>
    <div class="row">
      <div class="field"><label>账号</label><input id="account" value="CAMPUS_ACCOUNT"></div>
      <div class="field"><label>候选路线数</label><input id="tries" value="20" inputmode="numeric"></div>
    </div>
    <div class="field"><label>设备指纹</label><input id="device" value="DEVICE_FP_PLACEHOLDER"></div>
    <div class="field"><label>出口 IP</label><input id="ip" value="203.0.113.10"></div>
    <button class="primary" id="go" style="width:100%">生成会话</button>
    <div class="log" id="planlog"></div>
  </section>

  <section class="card c3">
    <h2>自审</h2>
    <div class="ring">
      <svg width="92" height="92" viewBox="0 0 92 92">
        <circle cx="46" cy="46" r="38" stroke="#1b2632" stroke-width="8" fill="none"/>
        <circle id="ringArc" cx="46" cy="46" r="38" stroke="#3ee08f" stroke-width="8" fill="none"
                stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="238.8"/>
      </svg>
      <div><div class="num" id="score">—</div><div class="cap">RISK SCORE</div>
        <div style="margin-top:8px"><span class="pill" id="verdict"><i></i><span>—</span></span></div></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDist">—</b><span>里程 m</span></div>
      <div class="stat"><b id="sDur">—</b><span>用时 s</span></div>
      <div class="stat"><b id="sPace">—</b><span>配速 s/km</span></div>
      <div class="stat"><b id="sRatio">—</b><span>步数比</span></div>
    </div>
    <div style="margin-top:12px" class="inline">
      <button class="ghost sm" id="export">导出 session.json</button>
    </div>
  </section>

  <section class="card c5">
    <h2>平台硬约束</h2>
    <div class="rules" id="rules">
      <div class="rule ok"><div class="ic">✓</div><div><b>单设备登录</b><p>一个账号只绑一台设备</p></div></div>
      <div class="rule ok"><div class="ic">✓</div><div><b>模式白名单</b><p>只请求学校开设的模式</p></div></div>
      <div class="rule ok"><div class="ic">✓</div><div><b>密码尝试</b><p>失败即停，不做重试/喷洒</p></div></div>
    </div>
    <h2 style="margin-top:16px">路线</h2>
    <div class="muted" id="routeInfo">尚未生成路线</div>
  </section>

  <section class="card c7">
    <h2>检测矩阵</h2>
    <div class="checks" id="checks"><div class="muted">生成一次会话后显示 15 项判定</div></div>
  </section>

  <section class="card c6">
    <h2>风控账本</h2>
    <table><thead><tr><th>类型</th><th>值</th><th>状态</th><th>分数</th></tr></thead>
      <tbody id="ledger"><tr><td colspan="4" class="muted">空</td></tr></tbody></table>
    <div class="inline" style="margin-top:12px">
      <input id="resp" placeholder='粘贴服务端返回，例：{"msg":"检测到异常运动数据"}'>
      <button class="ghost sm" id="observe">入库</button>
    </div>
    <div class="log" id="obslog"></div>
  </section>

  <section class="card c6">
    <h2>更新</h2>
    <div class="field"><label>清单地址（URL 或本地路径）</label>
      <input id="manifest" value="https://TARGET.example/crun/manifest.json"></div>
    <div class="inline">
      <button class="ghost sm" id="chk">检查更新</button>
      <button class="ghost sm" id="apply">应用更新</button>
      <span class="muted" id="uptime">—</span>
    </div>
    <div class="log" id="uplog"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const api = async (p, body) => {
  const r = await fetch(p, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  return r.json();
};
function toast(msg, kind='') {
  const el = document.createElement('div');
  el.className = 't ' + kind; el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function pill(el, verdict) {
  el.className = 'pill ' + (verdict === 'RUN' ? 'run' : verdict === 'THROTTLE' ? 'throttle' : verdict === 'ABORT' ? 'abort' : '');
  el.querySelector('span').textContent = verdict;
}
function renderChecks(checks) {
  if (!checks) return;
  $('checks').innerHTML = checks.map(c => `
    <div class="chk ${c.fail ? 'fail' : ''}">
      <i></i><span>${c.name}</span><span class="d">${c.detail}</span>
    </div>`).join('');
}
function renderState(s) {
  $('ver').textContent = 'v' + s.version;
  $('ledger').innerHTML = s.ledger.length ? s.ledger.map(e => `
    <tr><td>${e.kind}</td><td>${String(e.value).slice(0, 18)}</td>
    <td><span class="tag ${e.status}">${e.status}</span></td><td>${e.score.toFixed(1)}</td></tr>`).join('')
    : '<tr><td colspan="4" class="muted">空</td></tr>';
  $('routeInfo').textContent = `历史路线 ${s.routes} 条 · 账号 ${Object.keys(s.policy.accounts || {}).length} 个 · 工作区 ${s.work}`;
  if (s.last && s.last.audit) {
    const a = s.last.audit;
    $('score').textContent = a.score.toFixed(1);
    const pct = Math.min(1, a.score / 100);
    $('ringArc').setAttribute('stroke', a.score < 22 ? '#3ee08f' : a.score < 45 ? '#f0b354' : '#ff5f6d');
    $('ringArc').setAttribute('stroke-dashoffset', String(238.8 * (1 - pct * 0.98)));
    pill($('verdict'), a.verdict);
    if (s.last.distance_m) {
      $('sDist').textContent = Math.round(s.last.distance_m);
      $('sDur').textContent = Math.round(s.last.duration_s);
      $('sPace').textContent = Math.round(s.last.pace);
      $('sRatio').textContent = s.last.steps || '—';
    }
    renderChecks(a.checks);
    if (s.last.route) $('routeInfo').textContent += ` · 重叠 ${s.last.route.overlap}`;
  }
}
async function boot() { renderState(await api('/api/state')); }
$('refresh').onclick = boot;

$('go').onclick = async () => {
  $('go').disabled = true; $('go').textContent = '生成中…';
  try {
    const body = {
      distance: $('distance').value, pace: $('pace').value, mode: $('mode').value,
      account: $('account').value, device: $('device').value, ip: $('ip').value,
      tries: $('tries').value
    };
    const r = await api('/api/simulate', body);
    pill($('verdict'), r.verdict || 'ABORT');
    $('planlog').textContent = r.route
      ? `路线 ${r.route.fp} · 覆盖 ${r.route.cells} 格 · 重叠 ${r.route.overlap} · 转角 ${r.route.max_turn_deg}° · 候选 ${r.route.candidates}`
      : (r.reasons || []).join('\n');
    if (r.audit) {
      $('score').textContent = r.audit.score.toFixed(1);
      const pct = Math.min(1, r.audit.score / 100);
      $('ringArc').setAttribute('stroke-dashoffset', String(238.8 * (1 - pct * 0.98)));
      $('ringArc').setAttribute('stroke', r.audit.score < 22 ? '#3ee08f' : r.audit.score < 45 ? '#f0b354' : '#ff5f6d');
      renderChecks(r.audit.checks);
      if (r.session) {
        $('sDist').textContent = Math.round(r.session.distance_m);
        $('sDur').textContent = Math.round(r.session.duration_s);
        $('sPace').textContent = Math.round(r.session.pace);
      }
      if (r.steps) $('sRatio').textContent = r.steps.ratio;
    }
    toast(r.verdict === 'RUN' ? '自审通过，可以提交' : (r.verdict === 'THROTTLE' ? '已降级重算' : '已拦截'),
          r.verdict === 'RUN' ? 'ok' : 'bad');
    if (r.actions && r.actions.length) $('planlog').textContent += '\n' + r.actions.join('\n');
  } catch (e) { toast('生成失败：' + e.message, 'bad'); }
  $('go').disabled = false; $('go').textContent = '生成会话';
};

$('observe').onclick = async () => {
  const r = await api('/api/observe', {
    text: $('resp').value, account: $('account').value, device: $('device').value, ip: $('ip').value });
  $('obslog').textContent = r.hits.length
    ? r.hits.map(h => `${h.kind} ← ${h.matched.join(',')}`).join('\n')
    : '未命中风控话术';
  toast(r.hits.length ? '已入库并锁定账号' : '未命中', r.hits.length ? 'bad' : '');
  boot();
};

$('chk').onclick = async () => {
  const r = await api('/api/update/check', {manifest: $('manifest').value});
  $('uplog').textContent = r.ok
    ? `当前 ${r.current} → 最新 ${r.latest} ${r.update_available ? '(可更新)' : '(已最新)'}\n` +
      (r.notes || []).map(n => '· ' + n).join('\n')
    : '检查失败：' + r.error;
  $('uptime').textContent = r.ok ? (r.update_available ? '可更新' : '已最新') : '—';
};
$('apply').onclick = async () => {
  const r = await api('/api/update/apply', {manifest: $('manifest').value, dry_run: false});
  $('uplog').textContent = JSON.stringify(r, null, 2);
  toast(r.ok ? '更新完成' : '更新失败：' + (r.error || ''), r.ok ? 'ok' : 'bad');
};
$('export').onclick = () => window.open('/api/export', '_blank');

boot();
</script>
</body>
</html>
